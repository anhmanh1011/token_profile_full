# deploy/ansible.cfg — cấu hình Ansible cho stack token-tool.
# Tự nạp khi chạy lệnh ansible với CWD = deploy/.
[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
interpreter_python   = auto_silent
forks                = 10
# vault_password_file: TÙY CHỌN. Bỏ comment để mọi lệnh tự đọc mật khẩu vault
# từ file (đã gitignore). Makefile cũng tự truyền --vault-password-file khi
# file .vault-pass tồn tại, nên có thể để nguyên comment.
# vault_password_file = .vault-pass

[ssh_connection]
pipelining = True
# Password auth (root): control node cần `sshpass` cài sẵn (apt/brew install sshpass).
# Mật khẩu KHÔNG để ở đây/inventory — lấy từ vault (vps_ssh_passwords). Nếu sau này
# chuyển sang SSH key, chỉ cần bỏ ansible_password trong inventory + thêm key.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o PubkeyAuthentication=no -o PreferredAuthentications=password

[privilege_escalation]
# become bật ở cấp play (provision/deploy cần root); để mặc định tắt ở đây.
become        = False
become_method = sudo
